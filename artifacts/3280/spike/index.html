<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Tool Calling Visualization - fluent-next spike</title>
    <script>
        (function () {
            var theme = 'fluent-next.blue.light';

            try {
                theme = window.localStorage.getItem('currentThemeId') || theme;
            } catch (e) { /* the default theme is used */ }

            document.write('<link id="theme-stylesheet" rel="stylesheet" type="text/css" href="css/dx.' + theme + '.css" />');
        }());
    </script>
    <script type="text/javascript" src="js/jquery.js"></script>
    <script type="text/javascript" src="js/dx.all.debug.js" charset="utf-8"></script>
    <style>
      body {
            margin: 0;
        }

        .theme-switcher {
            max-width: 45rem;
            margin: var(--dxds-spacing-300, 1.875rem) auto 0;
        }

        /* Chat with its header on the page */
        .spike {
            max-width: 45rem;
            margin: var(--dxds-spacing-300, 1.875rem) auto;
            border: var(--dxds-border-width-10, 0.0625rem) solid var(--dxds-color-border, var(--dx-color-border));
            border-radius: var(--dxds-border-radius-120, 0.75rem);
            overflow: hidden;
        }

        .spike .dx-toolbar {
            padding-inline: var(--dxds-spacing-200, 1.25rem);
            border-block-end: var(--dxds-border-width-10, 0.0625rem) solid var(--dxds-color-border-subtle, var(--dx-color-separator));
        }

        .spike .dx-toolbar-label {
            font-weight: var(--dxds-font-weight-title-strong, 700);
        }

        .spike .dx-chat {
            --dx-chat-border-width: 0;
            --dx-chat-border-radius: 0;
        }

        .suggestions {
            width: 100%;
            margin-block-start: var(--dxds-spacing-300, 1.875rem);
        }

        .suggestions {
            gap: var(--dxds-global-spacing-item-gap-medium, 0.75rem);
        }

        .suggestions .dx-box-item-content {
            flex-direction: column;
        }

        .suggestions .dx-button {
            flex: 1;
            height: auto;
            border-radius: var(--dxds-border-radius-80, 0.5rem);
            background-color: var(--dxds-color-bg-secondary-subtle, var(--dx-color-options-panel-bg));
        }

        .suggestions .dx-button-content {
            padding: var(--dxds-spacing-150, 0.9375rem) var(--dxds-spacing-160, 1rem);
            align-self: stretch;
            justify-content: flex-start;
            height: auto;
            line-height: var(--dxds-line-height-base-md, 1.25rem);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: var(--dxds-spacing-100, 0.625rem);
            text-align: start;
            white-space: normal;
        }

        .suggestion-title {
            font-weight: var(--dxds-font-weight-base-strong, 600);
        }

        .suggestion-text {
            color: var(--dxds-color-content-subtle, var(--dx-color-icon));
        }

        .tool-calls,
        .tool-calls .dx-accordion {
            --dx-accordion-bg: transparent;
            --dx-accordion-title-bg-hovered: transparent;
            --dx-accordion-title-bg-active: transparent;
            --dx-accordion-item-opened-margin: 0;
        }

        .tool-calls > .dx-accordion-wrapper > .dx-accordion-item > .dx-accordion-item-title {
          padding: var(--dx-accordion-title-padding-block) var(--dx-accordion-title-padding-inline) var(--dx-accordion-title-padding-block) 0;
        }

        .tool-calls > .dx-accordion-wrapper > .dx-accordion-item > .dx-accordion-item-body {
          margin-inline-start: var(--dxds-spacing-100, 0.625rem);
        }

        .tool-calls-group > .dx-accordion-wrapper > .dx-accordion-item > .dx-accordion-item-body {
            padding-block-start: 0;
        }

        .tool-calls .dx-accordion-item-body {
            margin-inline-start: var(--dxds-spacing-220, 1.375rem);
            margin-block-end: var(--dxds-spacing-150, 0.9375rem);
            padding-inline-start: var(--dxds-spacing-150, 0.9375rem);
            padding-block-end: 0;
            border-inline-start: var(--dxds-border-width-10, 0.0625rem) solid var(--dxds-color-border-subtle, var(--dx-color-separator));
        }

        .tool-calls .dx-accordion-item-body {
          padding-inline-start: var(--dxds-spacing-200, 1.25rem);
        }

        .tool-calls-group > .dx-accordion-wrapper > .dx-accordion-item > .dx-accordion-item-body {
          padding-inline-start: var(--dxds-spacing-10, 0.0625rem);
        }

        .tool-calls .tool-icon {
            flex: none;
            width: var(--dxds-spacing-200, 1.25rem);
            height: var(--dxds-spacing-200, 1.25rem);
            margin-inline-end: var(--dxds-spacing-60, 0.375rem);
        }

        .tool-calls .dx-accordion-item-title::before {
            order: 1;
            margin-inline: var(--dxds-spacing-60, 0.375rem) 0;
        }

        .tool-calls .dx-accordion-item-title {
            color: var(--dxds-color-content-subtler, var(--dx-color-icon));
        }

        .tool-calls .dx-accordion-item-title:hover,
        .tool-calls .dx-accordion-item-opened > .dx-accordion-item-title {
            color: var(--dxds-color-content, var(--dx-color-text));
        }

        .tool-calls .dx-texteditor-input {
            font-family: var(--dxds-font-family-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
        }

        .tool-calls .tool-result-error {
            --dx-text-editor-border: transparent;
            --dx-text-editor-border-read-only: transparent;
            --dx-text-editor-content: var(--dxds-color-content-danger, var(--dx-color-danger));
        }

        .tool-calls .tool-result-error .dx-texteditor-input {
            color: var(--dxds-color-content-danger, var(--dx-color-danger));
        }

        .tool-calls .tool-result-error.dx-texteditor.dx-state-readonly {
            background-color: var(--dxds-color-bg-danger-subtler, color-mix(in srgb, var(--dx-color-danger) 12%, transparent));
        }

        .tool-error-tag {
            margin-inline-start: var(--dxds-spacing-100, 0.625rem);
            padding-block: var(--dxds-spacing-20, 0.125rem);
            padding-inline: var(--dxds-spacing-60, 0.375rem);
            border-radius: var(--dxds-border-radius-60, 0.375rem);
            background-color: var(--dxds-color-bg-danger-subtler, color-mix(in srgb, var(--dx-color-danger) 12%, transparent));
            color: var(--dxds-color-content-on-subtle-danger, var(--dx-color-text));
            font-size: var(--dxds-font-size-caption-md, 0.75rem);
            white-space: nowrap;
        }

        .tool-error {
            min-height: var(--dxds-spacing-440, 2.75rem);
        }
    </style>
</head>
<body class="dx-surface">
    <div role="main">
        <div class="theme-switcher">
            <div id="theme-selector"></div>
        </div>
        <div class="spike">
            <div id="toolbar"></div>
            <div id="chat"></div>
        </div>
    </div>
    <script>
        $(() => {
          const ICON_WRENCH = `<svg class="tool-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8.998 6.49647C8.998 4.01314 11.0122 2 13.4968 2C14.156 2 14.7833 2.14202 15.3488 2.3976C15.4983 2.46519 15.6051 2.60184 15.6345 2.76321C15.664 2.92458 15.6123 3.09011 15.4962 3.2061L13.2039 5.49723L14.4965 6.78911L16.7888 4.49801C16.9049 4.38202 17.0705 4.33036 17.2319 4.35978C17.3934 4.3892 17.5301 4.49596 17.5977 4.64542C17.8534 5.21057 17.9955 5.83761 17.9955 6.49647C17.9955 8.97979 15.9814 10.9929 13.4968 10.9929C13.1163 10.9929 12.7462 10.9456 12.3925 10.8564L6.02946 17.2992C5.1822 18.1571 3.82364 18.2372 2.88133 17.4849C1.79652 16.6187 1.69222 15.0076 2.65632 14.0089L9.07999 7.3549C9.02615 7.0767 8.998 6.78966 8.998 6.49647ZM13.4968 2.99921C11.5643 2.99921 9.99773 4.56499 9.99773 6.49647C9.99773 6.80296 10.0371 7.09953 10.1107 7.38174C10.1546 7.55022 10.1077 7.72941 9.98671 7.85471L3.37575 14.7028C2.82063 15.2778 2.88068 16.2054 3.50531 16.7042C4.04788 17.1374 4.83013 17.0912 5.31798 16.5973L11.89 9.94285C12.0233 9.80783 12.2217 9.75995 12.402 9.81926C12.7457 9.93234 13.1136 9.99372 13.4968 9.99372C15.4292 9.99372 16.9958 8.42794 16.9958 6.49647C16.9958 6.24994 16.9704 6.00967 16.922 5.778L14.85 7.84893C14.6548 8.04403 14.3383 8.04403 14.1431 7.84893L12.1436 5.85053C12.0498 5.75683 11.9972 5.62975 11.9972 5.49725C11.9972 5.36474 12.0498 5.23766 12.1436 5.14397L14.2156 3.07299C13.9838 3.02465 13.7434 2.99921 13.4968 2.99921Z" fill="currentColor"/></svg>`;
          const TOOL_ERROR_TEXT = 'Failed to execute the tool';
          const TOOL_DELAY = 1200;
          const RESULT_MAX_HEIGHT = 176;

          DevExpress.localization.loadMessages({
            en: {
              'dxChat-emptyListMessage': 'Chat is Empty',
              'dxChat-emptyListPrompt': 'AI Assistant is ready to answer your questions.',
              'dxChat-textareaPlaceholder': 'Ask AI Assistant...',
            },
          });

          const currentUser = { id: 'user', name: 'User' };
          const assistant = { id: 'assistant', name: 'AI Assistant', avatarUrl: 'artifacts/icons/Fluent_Avatar_(Ligth).svg' };

          // Mocked tools. A tool throws when it cannot complete the request.
          const toolImplementations = {
            getWeather: ({ city }) => {
              if (city !== 'London') {
                throw new Error(TOOL_ERROR_TEXT);
              }

              return '15°C (59°F)';
            },
            getCurrentTime: ({ locations }) => {
              const times = {
                Barcelona: '10:18 (UTC+01:00) Central European Time',
                'Los Angeles': '01:18 (UTC-08:00) Pacific Time (US & Canada)',
              };

              return locations.map((location) => `${location}: ${times[location]}`).join('\n');
            },
            getExchangeRate: ({ fromCurrency, toCurrency }) => JSON.stringify({
              base: fromCurrency,
              target: toCurrency,
              rate: 0.92,
              updated: '2026-10-13T14:32:00Z',
              providers: ['ecb', 'fed', 'boe'].map((name) => ({
                name,
                rate: 0.92,
                spread: 0.001,
                sources: ['spot', 'forward', 'swap'],
              })),
            }, null, 4),
          };

          const delay = (ms) => new Promise((resolve) => { setTimeout(resolve, ms); });

          const runTool = async ({ name, arguments: args }) => {
            await delay(TOOL_DELAY);

            try {
              return { name, arguments: args, status: 'success', result: toolImplementations[name](args) };
            } catch (error) {
              return { name, arguments: args, status: 'error', result: error.message };
            }
          };

          const suggestions = [{
            title: 'Weather',
            prompt: 'Check the current weather conditions in London.',
            calls: [{ name: 'getWeather', arguments: { country: 'UK', city: 'London' } }],
            text: 'The current weather conditions in London are 59°F (15°C).',
          }, {
            title: 'Current Time',
            prompt: 'Find out the current time in the Barcelona and Los Angeles offices.',
            calls: [{ name: 'getCurrentTime', arguments: { locations: ['Barcelona', 'Los Angeles'] } }],
            text: 'The current time in Barcelona is 10:18 (UTC+01:00) Central European Time and the current time in Los Angeles is 01:18 (UTC-08:00) Pacific Time (US & Canada).',
          }, {
            title: 'Weather in London and time in Barcelona',
            prompt: 'Check the weather in London and current time in Barcelona',
            calls: [
              { name: 'getWeather', arguments: { country: 'UK', city: 'London' } },
              { name: 'getCurrentTime', arguments: { locations: ['Barcelona'] } },
            ],
            text: 'The current weather conditions in London are 59°F (15°C). The current time in Barcelona is 10:18 (UTC+01:00) Central European Time.',
          }];

          // Any other text: several tools, one of them fails
          const freeTextScenario = {
            calls: [
              { name: 'getCurrentTime', arguments: { locations: ['Barcelona', 'Los Angeles'] } },
              { name: 'getWeather', arguments: { country: 'Atlantis', city: 'Poseidonis' } },
              { name: 'getExchangeRate', arguments: { fromCurrency: 'USD', toCurrency: 'EUR' } },
            ],
            text: 'I could not get the weather, but I found the current time and the exchange rate: 1 USD = 0.92 EUR.',
          };

          const getErrorCount = (toolCalls) => toolCalls.filter(({ status }) => status === 'error').length;

          const formatArguments = (args) => Object.entries(args)
            .map(([key, value]) => `${key}: ${JSON.stringify(value)}`)
            .join(', ');

          const renderErrorTag = (errorCount, container, showCount) => {
            const text = showCount ? `${errorCount} ${errorCount === 1 ? 'Error' : 'Errors'}` : 'Error';

            $('<span>')
              .addClass('tool-error-tag')
              .text(text)
              .appendTo(container);
          };

          const renderToolBody = (call, container) => {
            const isError = call.status === 'error';
            const textAreaOptions = {
              autoResizeEnabled: true,
              maxHeight: RESULT_MAX_HEIGHT,
              focusStateEnabled: false,
              hoverStateEnabled: false,
            };

            $('<div>').appendTo(container).dxForm({
              formData: { arguments: formatArguments(call.arguments), result: call.result },
              labelLocation: 'top',
              readOnly: true,
              items: [{
                dataField: 'arguments',
                label: { text: 'Arguments' },
                editorType: 'dxTextArea',
                editorOptions: textAreaOptions,
              },
              {
                dataField: 'result',
                label: { text: 'Result' },
                editorType: 'dxTextArea',
                editorOptions: isError
                  ? { ...textAreaOptions, elementAttr: { class: 'tool-result-error' } }
                  : textAreaOptions,
              }],
            });
          };

          const renderToolAccordion = (item, container, cssClass) => $('<div>')
            .addClass(cssClass)
            .appendTo(container)
            .dxAccordion({
              dataSource: [item],
              collapsible: true,
              selectedIndex: -1,
              itemTitleTemplate: (data, _, itemElement) => {
                $(ICON_WRENCH).appendTo(itemElement);
                $('<span>').text(data.title).appendTo(itemElement);

                if (data.errorCount) {
                  renderErrorTag(data.errorCount, itemElement, data.showErrorCount);
                }
              },
              itemTemplate: (data, _, itemElement) => data.render(itemElement),
            });

          const renderToolCalls = (toolCalls, container) => {
            if (toolCalls.length === 1) {
              const [call] = toolCalls;

              renderToolAccordion({
                title: call.name,
                errorCount: getErrorCount(toolCalls),
                render: (itemElement) => renderToolBody(call, itemElement),
              }, container, 'tool-calls');

              return;
            }

            renderToolAccordion({
              title: `${toolCalls.length} tools`,
              errorCount: getErrorCount(toolCalls),
              showErrorCount: true,
              render: (itemElement) => toolCalls.forEach((call) => {
                renderToolAccordion({
                  title: call.name,
                  errorCount: getErrorCount([call]),
                  render: (callElement) => renderToolBody(call, callElement),
                }, itemElement);
              }),
            }, container, 'tool-calls tool-calls-group');
          };

          const renderSuggestions = (container) => {
            const $host = $('<div>').addClass('suggestions').appendTo(container);

            $host.dxBox({
              direction: 'row',
              crossAlign: 'stretch',
              items: suggestions.map((suggestion) => ({
                ratio: 1,
                template: (_, __, itemElement) => {
                  $('<div>').appendTo(itemElement).dxButton({
                    stylingMode: 'outlined',
                    height: 'auto',
                    template: (___, buttonContent) => {
                      $('<span>').addClass('suggestion-title').text(suggestion.title).appendTo(buttonContent);
                      $('<span>').addClass('suggestion-text').text(suggestion.prompt).appendTo(buttonContent);
                    },
                    onClick: () => sendMessage(suggestion.prompt),
                  });
                },
              })),
            });
          };

          let chat;
          let clearButton;

          const respond = async (prompt) => {
            const scenario = suggestions.find(({ prompt: text }) => text === prompt) ?? freeTextScenario;

            chat.option('typingUsers', [assistant]);

            const toolCalls = await Promise.all(scenario.calls.map(runTool));

            chat.option('typingUsers', []);
            chat.renderMessage({
              author: assistant,
              timestamp: new Date(),
              text: scenario.text,
              toolCalls,
            });
          };

          const sendMessage = (text) => {
            const message = { author: currentUser, timestamp: new Date(), text };

            chat.renderMessage(message);
            clearButton.option('disabled', false);
            respond(text);
          };

          const THEME_KEY = 'currentThemeId';
          const DEFAULT_THEME = 'fluent-next.blue.light';
          const THEMES = [
            'carmine',
            'carmine.compact',
            'contrast',
            'contrast.compact',
            'dark',
            'dark.compact',
            'darkmoon',
            'darkmoon.compact',
            'darkviolet',
            'darkviolet.compact',
            'fluent-next.blue.dark',
            'fluent-next.blue.light',
            'fluent-next.blue.dark.compact',
            'fluent-next.blue.light.compact',
            'fluent.blue.dark',
            'fluent.blue.light',
            'fluent.saas.dark',
            'fluent.saas.light',
            'fluent.blue.dark.compact',
            'fluent.blue.light.compact',
            'fluent.saas.dark.compact',
            'fluent.saas.light.compact',
            'greenmist',
            'greenmist.compact',
            'light',
            'light.compact',
            'material.blue.dark',
            'material.blue.light',
            'material.lime.dark',
            'material.lime.light',
            'material.orange.dark',
            'material.orange.light',
            'material.purple.dark',
            'material.purple.light',
            'material.teal.dark',
            'material.teal.light',
            'material.blue.dark.compact',
            'material.blue.light.compact',
            'material.lime.dark.compact',
            'material.lime.light.compact',
            'material.orange.dark.compact',
            'material.orange.light.compact',
            'material.purple.dark.compact',
            'material.purple.light.compact',
            'material.teal.dark.compact',
            'material.teal.light.compact',
            'softblue',
            'softblue.compact',
          ];

          const getSavedTheme = () => {
            try {
              return window.localStorage.getItem(THEME_KEY) || DEFAULT_THEME;
            } catch (e) {
              return DEFAULT_THEME;
            }
          };

          const groupThemes = (themes) => {
            const groups = {};

            themes.forEach((theme) => {
              const [group] = theme.split('.');
              const key = group.charAt(0).toUpperCase() + group.slice(1);

              groups[key] = groups[key] ?? [];
              groups[key].push({ id: theme, text: theme.replaceAll('.', ' ') });
            });

            return Object.entries(groups).map(([key, items]) => ({ key, items }));
          };

          // The new stylesheet is inserted right after the old one (so it keeps the place before the page styles)
          const loadThemeCss = (themeId) => new Promise((resolve, reject) => {
            const oldLink = document.getElementById('theme-stylesheet');
            const newLink = oldLink.cloneNode();

            newLink.href = `css/dx.${themeId}.css`;
            newLink.onload = () => {
              oldLink.remove();
              resolve();
            };
            newLink.onerror = () => {
              newLink.remove();
              reject(new Error(`Failed to load theme: ${themeId}`));
            };
            oldLink.after(newLink);
          });

          $('#theme-selector').dxSelectBox({
            label: 'Theme',
            items: groupThemes(THEMES),
            grouped: true,
            displayExpr: 'text',
            valueExpr: 'id',
            value: getSavedTheme(),
            searchEnabled: true,
            onValueChanged: ({ value }) => {
              try {
                window.localStorage.setItem(THEME_KEY, value);
              } catch (e) { /* the choice is just not remembered */ }

              loadThemeCss(value).catch((error) => console.error(error));
            },
          });

          $('#toolbar').dxToolbar({
            items: [{
              text: 'Chat Tool Calling Visualization',
              location: 'before',
            }, {
              widget: 'dxButton',
              location: 'after',
              options: {
                icon: 'clearhistory',
                stylingMode: 'text',
                hint: 'Clear',
                disabled: true,
                onInitialized: ({ component }) => { clearButton = component; },
                onClick: () => {
                  chat.option({ items: [], typingUsers: [] });
                  clearButton.option('disabled', true);
                },
              },
            }],
          });

          chat = $('#chat').dxChat({
            user: currentUser,
            height: 560,
            showDayHeaders: true,
            showAvatar: true,
            showUserName: true,
            showMessageTimestamp: true,
            speechToTextEnabled: true,
            onMessageEntered: ({ message }) => {
              chat.renderMessage(message);
              clearButton.option('disabled', false);
              respond(message.text);
            },
            emptyViewTemplate: ({ texts }, container) => {
              $('<div>').addClass('dx-chat-messagelist-empty-message').text(texts.message).appendTo(container);
              $('<div>').addClass('dx-chat-messagelist-empty-prompt').text(texts.prompt).appendTo(container);
              renderSuggestions(container);
            },
            messageTemplate: ({ message }, container) => {
              if (message.toolCalls?.length) {
                renderToolCalls(message.toolCalls, container);
              }

              $('<div>').text(message.text ?? '').appendTo(container);
            },
          }).dxChat('instance');
        });
    </script>
</body>
</html>
