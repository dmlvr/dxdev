<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Fluent Next: тень, Popup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="lib/shadow-demo.js"></script>
</head>
<body>
<div id="top"></div>
<div id="stage"><div id="c"></div></div>
<div id="bottom"></div>
<script src="lib/jquery.js"></script>
<script src="lib/dx.all.js"></script>
<script>
  var q = ShadowDemo.q, wait = ShadowDemo.wait;
  ShadowDemo.run({
    title: "Popup",
    note: "dxPopup с заголовком. Тень берётся с контейнера <code>.dx-overlay-content</code>.",
    measured: ".dx-popup-wrapper > .dx-overlay-content",
    create: async function () {
      $('#c').dxPopup({ visible: true, onHiding: function (e) { e.cancel = true; }, width: 240, height: 130, title: 'Popup', animation: null, shading: false, container: '#stage', position: { my: 'top left', at: 'top left', of: '#stage', offset: '20 20' } });
      await wait(400);
      return q('.dx-popup-wrapper:not(.dx-popover-wrapper):not(.dx-actionsheet-popup-wrapper) > .dx-overlay-content');
    }
  });
</script>
</body>
</html>
